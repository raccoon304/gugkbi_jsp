<!DOCTYPE html>
<html lang="kor">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숨겼다가 보여주는 슬라이드</title>

    <link rel="stylesheet" href="css/quiz_exam_slide.css">
    <script type="text/javascript" src="js/quiz_exam_slide.js"></script>

</head>
<body>
    <div id="container">
        <div id="head">
            <div>
                <div>
                    <h2>쌍용교육센터 시험문제</h2>
                </div>
                <div>
                    <div><h3>남은시간</h3></div>
                    <div id="timer"></div>
                </div>
            </div>
        </div>
        <div id="body">
            <div style="display: flex;">
                <div style="margin: auto 1% auto auto;">
                    <button id="previous">◀</button>
                </div>

                <div id="box"></div>

                <div style="margin: auto auto auto 1%;">
                    <button id="next">▶</button>
                </div>
            </div> 
        </div>
            <h2 id="msg" style="text-align: center; color: red;"></h2>
        <div id="footer">
            <button type="button" id="btnSubmit">제출하기</button> 
            <p>[주의] "제출하기"버튼을 클릭하는 순간 취소가 불가능하므로 신중히 클릭하세요.</p>
        </div>
        <div id="redbox">
            <div id="result_tbl"></div>
        </div>
    </div>

</body>
</html>
