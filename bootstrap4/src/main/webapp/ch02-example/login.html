<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부트스트랩 페이지 링크 예제</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="../bootstrap-4.6.2-dist/css/bootstrap.min.css" type="text/css">

    <!-- Font Awesome 7 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 직접만든 CSS -->
    <link rel="stylesheet" href="./css/mycss.css">

</head>
<body>
    <div class="container">


        <!-- *********상단 네비게이션 시작********* -->
        <nav class="navbar navbar-expand-lg bg-light navbar-light sticky-top">
            <!-- Brand -->
            <a class="navbar-brand" href="#"><i class="fa-brands fa-windows fa-2x"></i></a>
        
            <!-- 아코디언같은 Navigation Bar 만들기 -->
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="collapsibleNavbar">

                <!-- Links -->
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link my_menufont_size" href="./index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link my_menufont_size" href="./board.html">게시판</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link my_menufont_size" href="./login.html">로그인</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link my_menufont_size" href="./register.html">회원가입</a>
                    </li>

                    <!-- Dropdown -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle my_menufont_size " href="#" id="navbardrop" data-toggle="dropdown">
                            Dropdown
                        </a>
                        <div class="dropdown-menu" aria-labelledby="navbardrop">
                            <a class="dropdown-item" href="#">Link 1</a>
                            <a class="dropdown-item" href="#">Link 2</a>
                            <a class="dropdown-item" href="#">Link 3</a>
                            <div class="dropdown-divider"></div><!-- 선긋기 -->
                            <a class="dropdown-item" href="#">Link 4</a>
                            <a class="dropdown-item" href="#">Link 5</a>
                        </div>
                    </li>
                </ul>
            </div>
        </nav>
        <!-- 상단 네비게이션 끝 -->


        <!-- 상단 컨텐츠 시작 -->
        <div class="row mt-4">
            <div class="col-md-3">
                <h2>로그인</h2>
                <p>회원 로그인 화면입니다. 회원 아이디와 비밀번호를 입력하고 로그인하세요.</p>
            </div>
            <div class="col-md-9 ">
                <img src="./images/Tulips.jpg" alt="Tulips" class="img-fluid">            
            </div>
        </div>
        <!-- 상단 컨텐츠 끝 -->


        <!-- 중단 컨텐츠 시작 -->
        <div class="row mt-4">
            <div class="col-md-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link " href="./register.html">회원가입</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">아이디찾기</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">비밀번호찾기</a>
                    </li>
                </ul>
            </div>

            <div class="col-md-9">
                <!-- 경고메시지 시작 -->
                <div class="alert alert-warning alert-dismissible fade show" role="alert">
                    공용으로 사용하는 PC에서는 <strong>&quot;비밀번호 기억하기&quot;</strong>를 체크하면 개인정보 유출의 위험이있습니다.
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <!-- 경고메시지 끝 -->

                <div class="row">
                    <!-- 로그인 폼 시작 -->
                    <div class="col-md-9">
                        <form>
                            <fieldset>
                                <legend class="MB-4">회원로그인</legend>

                                <div class="form-group row">
                                    <label for="userId" class="col-md-3 col-form-label">아이디</label>
                                    <div class="col-md-9">
                                        <input type="text" class="form-control" id="userId" placeholder="아이디입력">
                                    </div>
                                </div>  

                                <div class="form-group row">
                                    <label for="passwd" class="col-md-3 col-form-label">비밀번호</label>
                                    <div class="col-md-9">
                                        <input type="text" class="form-control" id="passwd" placeholder="비밀번호 입력">
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label for="Remember" class="col-md-3 col-form-label">비밀번호 기억하기</label>
                                    <div class="col-md-1">
                                        <input type="checkbox" class="form-control" id="Remember">
                                    </div>
                                </div>

                            </fieldset>
                        </form>	
                    </div>
                    <!-- 로그인 폼 끝 -->


                    <div class="col-md-3" style="display: flex;">
                        <button type="button" class="btn btn-success" style="width: 100px; height: 100px; font-size: 16pt; margin: auto;">로그인</button>
                    </div>

                </div>
            </div>
        </div>    
        <!-- 중단 컨텐츠 끝 -->
        
        <!-- footer 시작 -->
        <hr>
            <p class="text-center">&copy; Company 2025</p>
        <!-- footer 끝 -->
    </div>

    <!-- Optional JavaScript -->
    <script src="../js/jquery-3.7.1.min.js" type="text/javascript"></script>
    <script src="../bootstrap-4.6.2-dist/js/bootstrap.bundle.min.js" type="text/javascript"></script> 
</body>
</html>
